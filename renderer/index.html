<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advisor Console</title>
<style>
:root{
  --maroon:#862633;--maroon-bright:#A6303F;--maroon-deep:#5E1A24;
  --grey:#6B6C70;--grey-light:#9A9B9E;--grey-pale:#E8E8EA;
  --paper:#F7F6F4;--white:#FFF;--ink:#1C1C1E;--line:#D8D6D2;
  --ok:#3E7A4E;--ok-bg:#E4F0E6;--warn:#B5852A;--warn-bg:#FBF2DE;
  --err:#B23A48;--err-bg:#FBE3E6;
  --ip:#4A5A7A;--ip-bg:#E8ECF4;
  --note:#3E5C76;--note-bg:#E8EEF4;
  --shadow:0 1px 2px rgba(28,28,30,.08),0 4px 14px rgba(28,28,30,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;display:grid;grid-template-columns:260px 1fr;height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--maroon-bright);outline-offset:2px}

nav{background:var(--maroon-deep);color:#fff;display:flex;flex-direction:column;height:100vh}
nav .brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.15)}
nav .brand h1{font-family:Georgia,serif;font-size:1.2rem;font-weight:700}
nav .brand .rule{width:32px;height:3px;background:#fff;margin:9px 0 7px;opacity:.8}
nav .brand p{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;opacity:.75;line-height:1.5}
nav .roster{flex:1;overflow-y:auto;padding:10px 0}
nav .roster-head{font-size:.62rem;text-transform:uppercase;letter-spacing:.13em;opacity:.6;padding:8px 20px}
.rosterempty{padding:14px 20px;font-size:.8rem;opacity:.6}
.advisee{width:100%;text-align:left;background:none;border:none;color:rgba(255,255,255,.85);padding:9px 20px;font-size:.86rem;border-left:3px solid transparent;display:flex;flex-direction:column;gap:1px}
.advisee:hover{background:rgba(255,255,255,.08);color:#fff}
.advisee.active{background:rgba(255,255,255,.12);border-left-color:#fff;color:#fff}
.advisee .nm{font-weight:600}
.advisee .meta{font-size:.68rem;opacity:.7}
.flagdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px}
nav .navfoot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.15);display:flex;flex-direction:column;gap:6px}
.nbtn{background:#fff;color:var(--maroon);border:none;padding:9px;border-radius:5px;font-weight:600;font-size:.79rem}
.nbtn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.filestatus{font-size:.63rem;opacity:.75;line-height:1.4;padding:2px 2px 4px;word-break:break-all}
.filestatus .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px}
.filestatus.saving .dot{background:var(--warn)}

main{overflow-y:auto;height:100vh}
.empty-main{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;color:var(--grey);text-align:center;padding:40px}
.empty-main h2{font-family:Georgia,serif;font-size:1.6rem;color:var(--ink);margin-bottom:10px}
.empty-main p{max-width:460px;font-size:.9rem;margin-bottom:8px;line-height:1.6}
.empty-main .row{display:flex;gap:10px;margin-top:16px}
.bigbtn{background:var(--maroon);color:#fff;border:none;padding:12px 22px;border-radius:6px;font-weight:600;font-size:.9rem}
.bigbtn.ghost{background:#fff;color:var(--maroon);border:1.5px solid var(--maroon)}

.topbar{background:var(--maroon);color:#fff;padding:18px 30px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.topbar h2{font-family:Georgia,serif;font-size:1.4rem}
.topbar .meta{font-size:.78rem;opacity:.92;margin-top:3px;display:flex;gap:14px;flex-wrap:wrap}
.topbar .meta .catalog.missing{background:var(--warn);color:#3A2D08;padding:0 7px;border-radius:3px;font-weight:700}
.topbar-actions{position:absolute;top:18px;right:30px;display:flex;gap:8px}
.tbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;padding:7px 12px;border-radius:5px;font-size:.76rem;font-weight:600}
.tbtn:hover{background:rgba(255,255,255,.24)}
.tbtn.solid{background:#fff;color:var(--maroon)}
.tbtn.danger{border-color:rgba(255,255,255,.45)}
.tbtn.danger:hover{background:var(--err);border-color:var(--err);color:#fff}

.body{max-width:980px;margin:0 auto;padding:22px 30px 80px}
.editbanner{background:var(--warn-bg);border:1px solid var(--warn);color:#7A5A18;border-radius:6px;padding:9px 14px;font-size:.8rem;font-weight:600;margin-bottom:16px}
.catalert{background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:6px;padding:11px 16px;font-size:.82rem;color:#6B4E15;margin-bottom:16px;line-height:1.5}

.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;box-shadow:var(--shadow)}
.stat .num{font-size:1.6rem;font-weight:700;font-family:Georgia,serif;line-height:1}
.stat .num .of{font-size:.85rem;color:var(--grey-light)}
.stat .lbl{font-size:.65rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);margin-top:4px}
.stat .lbl .pg{color:var(--ip);text-transform:none;letter-spacing:0;font-weight:600}
.stat .bar{height:6px;background:var(--grey-pale);border-radius:3px;margin-top:8px;overflow:hidden;display:flex}
.stat .bar .e{background:var(--maroon);height:100%}
.stat .bar .p{background:var(--ip);height:100%;opacity:.45}
.stat.done .num{color:var(--ok)}.stat.done .bar .e{background:var(--ok)}

.tabbar{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tab{background:none;border:none;padding:10px 16px;font-size:.88rem;font-weight:600;color:var(--grey);border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.active{color:var(--maroon);border-bottom-color:var(--maroon)}
.tab .cnt{font-size:.66rem;background:var(--err);color:#fff;border-radius:10px;padding:1px 6px;margin-left:5px}
.panel{display:none}.panel.active{display:block}

.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h3{font-size:.73rem;text-transform:uppercase;letter-spacing:.1em;color:var(--grey);margin-bottom:4px}
.cardnote{font-size:.78rem;color:var(--grey-light);margin-bottom:10px;font-style:italic}
.empty-hint{color:var(--grey);font-size:.85rem;font-style:italic;padding:6px 0}

.flagrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--grey-pale);font-size:.86rem}
.flagrow:first-of-type{border-top:none}
.fl-tag{flex:none;font-size:.6rem;font-weight:800;letter-spacing:.08em;padding:2px 7px;border-radius:3px;width:62px;text-align:center}
.flagrow.warn .fl-tag{background:var(--err);color:#fff}
.flagrow.need .fl-tag{background:var(--maroon);color:#fff}
.flagrow.watch .fl-tag{background:var(--ip);color:#fff}
.flagrow.note .fl-tag{background:var(--grey-pale);color:var(--grey)}
.fl-sec{flex:none;width:150px;font-weight:700;font-size:.8rem}
.fl-text{flex:1;color:var(--ink)}
.flagrow.warn .fl-text{font-weight:600}

.iprow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--grey-pale);font-size:.85rem}
.ipnum{font-weight:700;width:80px;flex:none}
.iptitle{flex:1}
.ipsec{color:var(--grey);font-size:.78rem;width:150px;flex:none}
.ipcr{color:var(--ip);font-weight:700;flex:none}

.qrow{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--grey-pale)}
.qrow input{accent-color:var(--maroon);margin-top:4px}
.qtext{flex:1;font-size:.88rem}
.qtext.done{text-decoration:line-through;color:var(--grey-light)}
.qdel{border:none;background:none;color:var(--grey-light);font-size:1rem}
.qdel:hover{color:var(--err)}
.qadd{display:flex;gap:8px;margin-top:12px}
.qadd input{flex:1;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:.88rem;font-family:inherit}
.btnq{background:var(--maroon);color:#fff;border:none;padding:8px 16px;border-radius:5px;font-weight:600;font-size:.82rem}

.reqblock{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden}
.reqblock>h3{background:var(--maroon-deep);color:#fff;padding:10px 16px;font-size:.92rem;font-weight:700;display:flex;justify-content:space-between}
.reqblock>h3 em{font-style:normal;opacity:.8;font-weight:500}
.section{border-top:1px solid var(--line)}
.section-head{padding:9px 16px 5px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.section-head .sname{font-weight:700;font-size:.88rem}
.section-head .snote{font-size:.72rem;color:var(--grey)}
.section-head .status{margin-left:auto;font-size:.7rem;font-weight:700;padding:2px 9px;border-radius:20px}
.status.met{background:var(--ok-bg);color:var(--ok)}
.status.partial{background:var(--warn-bg);color:var(--warn)}
.status.empty{background:var(--grey-pale);color:var(--grey)}
.waive-row{padding:2px 16px 6px;font-size:.8rem;color:var(--grey)}
.waive-row input{accent-color:var(--maroon);margin-right:5px}
.grouphint{padding:2px 16px 8px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.gchip{font-size:.73rem;font-weight:600;padding:3px 11px;border-radius:20px;border:1.5px solid var(--line);color:var(--grey)}
.gchip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.gchip.prog{border-color:var(--ip);color:var(--ip);border-style:dashed}
.ghelp{font-size:.72rem;color:var(--grey-light);font-style:italic}

table.courses{width:100%;border-collapse:collapse;font-size:.83rem}
table.courses td{padding:5px 14px;border-top:1px solid var(--grey-pale);vertical-align:middle}
.crow.complete{background:var(--maroon);color:#fff}
.crow.inprogress{background:var(--ip-bg);color:var(--ink)}
.crow.misplaced{background:var(--err-bg)}
.crow.failed{background:var(--grey-pale);color:var(--grey)}
.crow.planned{background:#fff}
.crow .cnum{font-weight:700}
.crow .cnote{font-size:.75rem;color:var(--grey)}
.crow.complete .cnote{color:rgba(255,255,255,.7)}
.ipbadge{font-size:.6rem;font-weight:800;letter-spacing:.06em;background:var(--ip);color:#fff;padding:2px 6px;border-radius:3px}
.norows{color:var(--grey-light);font-style:italic;padding:8px 14px}
.flagline{font-size:.72rem;color:var(--err);padding:2px 14px 6px}
table.courses input{width:100%;border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:.81rem;background:#fff;color:var(--ink)}
.crow.complete input{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.35)}
.ipbox{font-size:.7rem;color:var(--grey);white-space:nowrap;display:flex;align-items:center;gap:4px}
.ipbox input{width:auto;accent-color:var(--ip)}
.rowdel{border:none;background:none;color:var(--grey-light);font-size:1rem;padding:2px 6px}
.rowdel:hover{color:var(--err)}
.addrow{margin:6px 14px 10px;background:var(--paper);border:1px dashed var(--line);color:var(--maroon);padding:6px 12px;border-radius:5px;font-size:.78rem;font-weight:600}
.editinfo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fld label{display:block;font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);font-weight:600;margin-bottom:3px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:8px 10px;font-size:.88rem;font-family:inherit}

.commentbtn{border:1px solid var(--note);background:var(--note-bg);color:var(--note);border-radius:4px;font-size:.68rem;padding:2px 8px;font-weight:600}
.commentbtn:hover,.commentbtn.has{background:var(--note);color:#fff}
.inline-comment{background:var(--note-bg);border-left:3px solid var(--note);padding:6px 14px;font-size:.8rem}
.inline-comment .lbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--note);font-weight:700;margin-right:6px}
.notewrap{padding:8px 14px 12px}
textarea.advisor{width:100%;border:1px solid var(--note);border-radius:6px;padding:9px 11px;font-family:inherit;font-size:.88rem;background:var(--note-bg);min-height:60px;resize:vertical}
.advisor-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--note);font-weight:700;margin-bottom:5px}
.advisor-label::before{content:"\270E  "}

.readfield{margin-bottom:12px}
.readfield .rl{font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);font-weight:600;margin-bottom:3px}
.readfield .rv{font-family:Georgia,serif;font-size:.93rem;white-space:pre-wrap;background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:9px 12px}
.readfield .rv.empty{color:var(--grey-light);font-style:italic}
.intern-read{background:#fff;border:1px solid var(--line);border-left:4px solid var(--maroon);border-radius:6px;padding:12px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.intern-read .ih{font-weight:700;font-size:.92rem}
.intern-read .is{font-size:.7rem;color:#fff;background:var(--grey);padding:1px 8px;border-radius:10px;margin-left:8px}
.intern-read .id{font-size:.79rem;color:var(--grey);margin-top:3px}
.intern-read .inote{font-family:Georgia,serif;font-size:.85rem;margin-top:6px}

.meeting{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 16px;margin-bottom:11px;box-shadow:var(--shadow)}
.meeting .mh{display:flex;align-items:baseline;margin-bottom:5px}
.meeting .mdate{font-weight:700;font-size:.84rem}
.meeting .mdel{margin-left:auto;border:none;background:none;color:var(--grey-light);font-size:1rem}
.meeting .mbody{font-family:Georgia,serif;font-size:.89rem;white-space:pre-wrap}
.addmeeting{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:flex-end}
.addmeeting .fld{flex:1;min-width:120px}

#modal{position:fixed;inset:0;background:rgba(28,28,30,.5);display:none;z-index:60;align-items:center;justify-content:center;padding:30px}
#modal.show{display:flex}
#modal .sheet{background:#fff;border-radius:8px;width:min(500px,100%);padding:22px 24px;border-top:5px solid var(--note)}
#modal h3{font-size:1rem;margin-bottom:4px}
#modal .ctx{font-size:.8rem;color:var(--grey);margin-bottom:12px}
#modal textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:inherit;font-size:.9rem;min-height:100px}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#modal .btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:5px;font-weight:600;font-size:.84rem}
#modal .btn.primary{background:var(--note);border-color:var(--note);color:#fff}

.ovbtn{margin-left:8px;border:1px solid var(--grey-light);background:transparent;color:var(--grey);
  border-radius:4px;font-size:.66rem;font-weight:700;letter-spacing:.03em;padding:2px 8px}
.ovbtn:hover{border-color:var(--maroon);color:var(--maroon)}
.ovbtn.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.status.ovr{background:var(--maroon);color:#fff}
.ovnote{background:#F3EAEC;border-left:3px solid var(--maroon);padding:7px 14px;font-size:.8rem;color:#5E1A24}
.ovnote .ovlbl{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;font-weight:800;margin-right:7px}
.ovnote em{display:block;font-style:normal;font-size:.7rem;opacity:.7;margin-top:2px}
#ovModal{position:fixed;inset:0;background:rgba(28,28,30,.5);display:none;z-index:65;align-items:center;justify-content:center;padding:30px}
#ovModal.show{display:flex}
#ovModal .sheet{background:#fff;border-radius:8px;width:min(520px,100%);padding:22px 24px;border-top:5px solid var(--maroon)}
#ovModal h3{font-size:1.05rem;margin-bottom:6px}
#ovModal .ctx{font-size:.84rem;color:var(--grey);margin-bottom:12px;line-height:1.5}
#ovModal .ctx strong{color:var(--ink);font-size:.92rem}
#ovModal textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-family:inherit;font-size:.9rem;min-height:90px}
#ovModal .ovhint{font-size:.76rem;color:var(--grey);margin-top:8px;line-height:1.5;font-style:italic}
#ovModal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#ovModal .btn{border:1px solid var(--line);background:#fff;padding:8px 16px;border-radius:5px;font-weight:600;font-size:.84rem;color:var(--ink)}
#ovModal .btn.primary{background:var(--maroon);border-color:var(--maroon);color:#fff}
#ovModal .btn.danger{margin-right:auto;border-color:var(--err);color:var(--err)}

table.ledger{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:4px}
table.ledger th{text-align:right;font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--grey);
  font-weight:700;padding:5px 10px;border-bottom:1px solid var(--line)}
table.ledger th:first-child{text-align:left}
table.ledger td{padding:8px 10px;border-bottom:1px solid var(--grey-pale);text-align:right;font-variant-numeric:tabular-nums}
table.ledger td:first-child{text-align:left}
table.ledger .lname{font-weight:700;display:block}
table.ledger .lreq{font-size:.7rem;color:var(--grey-light)}
table.ledger .lprog{color:var(--ip)}
table.ledger .lshort{color:var(--err);font-weight:700}
table.ledger .lok{color:var(--ok);font-weight:700}
table.ledger .ltotal{font-weight:700}
table.ledger .ltyp{color:var(--grey);font-variant-numeric:tabular-nums}
table.ledger .loff{color:var(--maroon)}
table.ledger .ledger-total td{border-top:2px solid var(--ink);border-bottom:none;font-weight:800;padding-top:9px}
.ledgernote{font-size:.8rem;color:var(--grey);margin-top:10px;line-height:1.55;
  background:var(--paper);border-left:3px solid var(--maroon);padding:8px 12px;border-radius:0}
.ledgernote strong{color:var(--ink)}
.ledgerwarn{color:var(--err);font-weight:700;display:block;margin-top:4px}

.verdict{display:flex;gap:20px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--grey);border-radius:8px;padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.verdict.open{border-left-color:var(--maroon)}
.verdict.hours{border-left-color:var(--warn)}
.verdict.ok{border-left-color:var(--ok)}
.verdict .v-main{flex:none;text-align:center;padding-right:20px;border-right:1px solid var(--line)}
.verdict .v-count{font-family:Georgia,serif;font-size:2rem;font-weight:700;line-height:1;display:block}
.verdict.ok .v-count{color:var(--ok)}
.verdict.open .v-count{color:var(--maroon)}
.verdict .v-of{font-size:1rem;color:var(--grey-light)}
.verdict .v-lbl{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--grey);font-weight:700}
.verdict .v-body{flex:1;font-size:.88rem;line-height:1.55}
.stat.req .num{font-size:1.5rem}
.stat.req .num .of{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--grey);font-weight:700}
.stat.req.done .num{color:var(--ok)}
.stat .subhrs{font-size:.72rem;color:var(--grey);margin-top:6px;font-variant-numeric:tabular-nums}
.stat .subhrs .pg{color:var(--ip)}
.unmetrow{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-top:1px solid var(--grey-pale)}
.unmetrow:first-of-type{border-top:none}
.um-name{flex:1;font-weight:700;font-size:.9rem}
.um-state{font-size:.78rem;color:var(--maroon);font-weight:600}
.allmet{color:var(--ok);font-weight:700;font-size:.9rem;padding:4px 0}
.print-advisor-note{display:none}
#printHead{display:none}

/* ---------- PRINT / PDF EXPORT ---------- */
@media print{
  body{display:block;height:auto;overflow:visible;background:#fff}
  nav,.topbar-actions,.tabbar,.addmeeting,.commentbtn,textarea.advisor,.advisor-label,
  .mdel,.qdel,.qadd,#modal,#ovModal,.ovbtn,.addrow,.rowdel,.editbanner,.waive-row,.cardnote{display:none!important}
  .ovnote{background:#fff;border-left:2px solid #000;color:#000}
  main{height:auto;overflow:visible}
  .topbar{position:static;background:#fff;color:#000;border-bottom:3px double #000;padding:0 0 10px;box-shadow:none}
  .topbar h2{font-size:1.4rem}
  .topbar .meta{color:#333}
  .topbar .meta .catalog.missing{background:none;color:#000;font-weight:700;border:1px solid #000}
  #printHead{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:#555;margin-bottom:6px}
  .body{max-width:100%;padding:12px 0 0}
  .panel{display:block!important;page-break-inside:auto}
  .panel+.panel{margin-top:16px;border-top:1px solid #999;padding-top:12px}
